# Install pre-commit hooks via
# pre-commit install

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-json
    - id: check-yaml
    - id: end-of-file-fixer
      exclude: ^tests/.*\.txt
    - id: trailing-whitespace
      exclude: ^tests/.*\.txt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format

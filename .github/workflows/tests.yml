name: continuous-integration

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pre-commit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: pre-commit/action@v3.0.1

  tests:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --group test -e .
    - name: Run pytest
      run: pytest --durations=10 --cov=pytest_notebook --cov-report=xml --cov-report=term-missing --nb-coverage

    - name: Create cov
      run: coverage xml

    - name: Upload to Codecov
      # secrets are not available to dependabot-triggered runs,
      # and the upload fails without the token
      if: github.repository == 'chrisjsewell/pytest-notebook' && matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
      uses: codecov/codecov-action@v5
      with:
        name: pytests-notebook
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: pytests
        file: ./coverage.xml
        fail_ci_if_error: true

  all-good:

    # This job does nothing and is only used for the branch protection
    # see https://github.com/marketplace/actions/alls-green#why

    if: always()

    needs:
    - pre-commit
    - tests

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}

  publish:

    name: Publish to PyPi
    needs: [all-good]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-notebook
    permissions:
      id-token: write
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build package
      run: |
        pipx run flit build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
